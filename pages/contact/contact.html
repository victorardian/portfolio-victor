        <main class="mainblur">
            <h1>
                Contact
            </h1>
            <section class="container">
                <article class="home">
                    <h1>
                        Stuur iets naar mij via dit formulier
                    </h1>
                    <section class="aligner">
                        <form class="sendform">
                            <input type="text" placeholder="Naam" pattern="[A-Za-z]+" minlength="2" maxlength="40" name="contact" required>
                            <input type="email" placeholder="Email" name="contact" required>
                            <textarea placeholder="Bericht" class="message" name="contact" required></textarea>
                            <input type="submit" value="Stuur">
                        </form>
                    </section>
                </article>
            </section>
            <section class="alignmentbox">
                <article class="linkcontainer">
                    <a href="https://github.com/victorardian" target="_blank">
                        <img src="/images/github.png" alt="Link to GitHub" class="generalimage">
                    </a>
                </article>
            </section>
        </main>
